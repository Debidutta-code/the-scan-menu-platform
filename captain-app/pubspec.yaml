name: captain_app
description: "ScanMenu Dedicated Captain & Staff Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Sockets
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI, Icons, Typography & Animations
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.15
  intl: ^0.19.0
  badges: ^3.1.2
  flutter_animate: ^4.5.0

  # Audio & Feedback
  audioplayers: ^6.0.0

  # Push Notifications & Background Alerts
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
