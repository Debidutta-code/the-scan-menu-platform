<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.25" />

  <!-- Abstract QR Corner Accents -->
  <rect x="112" y="112" width="96" height="96" rx="24" fill="url(#accentGrad)" />
  <rect x="136" y="136" width="48" height="48" rx="12" fill="#0F172A" />

  <rect x="304" y="112" width="96" height="96" rx="24" fill="url(#accentGrad)" />
  <rect x="328" y="136" width="48" height="48" rx="12" fill="#0F172A" />

  <rect x="112" y="304" width="96" height="96" rx="24" fill="url(#accentGrad)" />
  <rect x="136" y="328" width="48" height="48" rx="12" fill="#0F172A" />

  <!-- Center Pixora Logo Mark - Stylized 'P' & Scan Beam -->
  <path d="M 272 240 L 368 240 C 394.5 240 416 261.5 416 288 C 416 314.5 394.5 336 368 336 L 304 336 L 304 400 C 304 408.8 296.8 416 288 416 C 279.2 416 272 408.8 272 400 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  
  <!-- Decorative Scan Line dot -->
  <circle cx="240" cy="272" r="16" fill="#FBBF24" />
</svg>
