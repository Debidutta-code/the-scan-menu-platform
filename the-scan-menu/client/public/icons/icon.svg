  <rect width="1254" height="1254" rx="275" fill="#000000" />

  <!-- Four Outer Scanner Reticle Corners (Pure White) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="74" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 436 215 L 245 215 A 84 84 0 0 0 161 299 L 161 415" />
    <path d="M 818 215 L 1009 215 A 84 84 0 0 1 1093 299 L 1093 415" />
    <path d="M 161 839 L 161 955 A 84 84 0 0 0 245 1039 L 436 1039" />
    <path d="M 1093 839 L 1093 955 A 84 84 0 0 1 1009 1039 L 818 1039" />
  </g>

  <!-- Central 'S-M' Monogram (Pure White) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="74" stroke-linecap="round" stroke-linejoin="round">
    <!-- S Continuous Stroke -->
    <path d="
      M 640 380
      L 365 380
      A 120 120 0 0 0 365 620
      L 570 620
      A 80 80 0 0 1 570 780
      L 275 780
    " />

    <!-- M Continuous Stroke -->
    <path d="
      M 410 500
