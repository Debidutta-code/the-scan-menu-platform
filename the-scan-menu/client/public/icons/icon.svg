<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0B0F" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect width="1254" height="1254" rx="275" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="1206" height="1206" rx="251" fill="none" stroke="#F59E0B" stroke-width="8" stroke-opacity="0.2" />

  <!-- Four Outer Scanner Reticle Corners (Accent Gold) -->
  <g fill="none" stroke="url(#amberGrad)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)">
    <path d="M 436 215 L 245 215 A 84 84 0 0 0 161 299 L 161 415" />
    <path d="M 818 215 L 1009 215 A 84 84 0 0 1 1093 299 L 1093 415" />
    <path d="M 161 839 L 161 955 A 84 84 0 0 0 245 1039 L 436 1039" />
    <path d="M 1093 839 L 1093 955 A 84 84 0 0 1 1009 1039 L 818 1039" />
  </g>

  <!-- Central 'S-M' Monogram (Pure Clean White with Stroke Caps) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="74" stroke-linecap="round" stroke-linejoin="round">
    <!-- S Continuous Stroke -->
    <path d="
      M 640 380
      L 365 380
      A 120 120 0 0 0 365 620
      L 570 620
      A 80 80 0 0 1 570 780
      L 275 780
    " />

    <!-- M Continuous Stroke -->
    <path d="
      M 410 500
      L 635 500
      L 810 670
      L 987 415
      L 987 780
    " />
  </g>
</svg>
